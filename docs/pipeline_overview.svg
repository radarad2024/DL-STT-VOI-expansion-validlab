<svg width="100%" viewBox="0 0 680 920" xmlns="http://www.w3.org/2000/svg" role="img">
<title>STT Classification Pipeline</title>
<desc>Deep learning pipeline for soft tissue tumor classification using three VOI strategies on multi-sequence MRI</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .arr { stroke: #888780; stroke-width: 1.5; }
  .leader { stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 3 2; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Section 1: MRI Input -->
<text class="th" x="340" y="30" text-anchor="middle" dominant-baseline="central">MRI acquisition</text>

<rect x="60" y="50" width="160" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="140" y="68" text-anchor="middle" dominant-baseline="central" fill="#0C447C">T1WI</text>
<text class="ts" x="140" y="86" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Anatomic detail</text>

<rect x="260" y="50" width="160" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="340" y="68" text-anchor="middle" dominant-baseline="central" fill="#0C447C">T2WI (FS)</text>
<text class="ts" x="340" y="86" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Water content</text>

<rect x="460" y="50" width="160" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="540" y="68" text-anchor="middle" dominant-baseline="central" fill="#0C447C">CE-FS-T1WI</text>
<text class="ts" x="540" y="86" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Enhancement</text>

<line x1="140" y1="100" x2="140" y2="130" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="100" x2="340" y2="130" class="arr" marker-end="url(#arrow)"/>
<line x1="540" y1="100" x2="540" y2="130" class="arr" marker-end="url(#arrow)"/>

<!-- Segmentation -->
<rect x="100" y="130" width="480" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="152" text-anchor="middle" dominant-baseline="central">Tumor segmentation (ITK-SNAP v3.8.0)</text>

<line x1="340" y1="174" x2="340" y2="204" class="arr" marker-end="url(#arrow)"/>

<!-- Section 2: VOI Strategies -->
<text class="th" x="340" y="218" text-anchor="middle" dominant-baseline="central">VOI definition</text>

<rect x="40" y="234" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="130" y="252" text-anchor="middle" dominant-baseline="central" fill="#712B13">R-VOI (Model 1)</text>
<text class="ts" x="130" y="272" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Bounding box</text>

<rect x="250" y="234" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="252" text-anchor="middle" dominant-baseline="central" fill="#085041">S-VOI (Model 2)</text>
<text class="ts" x="340" y="272" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Tumor mask</text>

<rect x="460" y="234" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="550" y="252" text-anchor="middle" dominant-baseline="central" fill="#3C3489">E-VOI (Model 3)</text>
<text class="ts" x="550" y="272" text-anchor="middle" dominant-baseline="central" fill="#534AB7">1 cm expansion</text>

<line x1="130" y1="290" x2="130" y2="312" class="arr"/>
<line x1="340" y1="290" x2="340" y2="312" class="arr"/>
<line x1="550" y1="290" x2="550" y2="312" class="arr"/>
<line x1="130" y1="312" x2="550" y2="312" class="arr"/>
<line x1="340" y1="312" x2="340" y2="335" class="arr" marker-end="url(#arrow)"/>

<!-- Section 3: Preprocessing -->
<rect x="100" y="335" width="480" height="90" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="356" text-anchor="middle" dominant-baseline="central">Preprocessing</text>
<text class="ts" x="160" y="378" text-anchor="middle" dominant-baseline="central">Resample</text>
<text class="ts" x="160" y="394" text-anchor="middle" dominant-baseline="central">1×1×2 mm</text>
<text class="ts" x="280" y="378" text-anchor="middle" dominant-baseline="central">Reshape</text>
<text class="ts" x="280" y="394" text-anchor="middle" dominant-baseline="central">128×128×80</text>
<text class="ts" x="400" y="378" text-anchor="middle" dominant-baseline="central">Normalize</text>
<text class="ts" x="400" y="394" text-anchor="middle" dominant-baseline="central">(x−μ)/σ×1000</text>
<text class="ts" x="520" y="378" text-anchor="middle" dominant-baseline="central">Augment</text>
<text class="ts" x="520" y="394" text-anchor="middle" dominant-baseline="central">5 transforms</text>

<line x1="340" y1="425" x2="340" y2="460" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="450" text-anchor="middle" dominant-baseline="central">Channel concatenation (3-ch input)</text>

<!-- Section 4: DenseNet-121 -->
<rect x="140" y="465" width="400" height="80" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="340" y="490" text-anchor="middle" dominant-baseline="central" fill="#0C447C">DenseNet-121 (3D)</text>
<text class="ts" x="220" y="514" text-anchor="middle" dominant-baseline="central" fill="#185FA5">AdamW, lr = 5×10⁻⁵</text>
<text class="ts" x="400" y="514" text-anchor="middle" dominant-baseline="central" fill="#185FA5">30 epochs, batch = 32</text>

<line x1="340" y1="545" x2="340" y2="580" class="arr" marker-end="url(#arrow)"/>

<!-- Section 5: Output -->
<rect x="200" y="580" width="280" height="50" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="th" x="340" y="598" text-anchor="middle" dominant-baseline="central" fill="#27500A">Classification output</text>
<text class="ts" x="340" y="616" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">Malignancy probability</text>

<line x1="340" y1="630" x2="340" y2="660" class="arr"/>
<line x1="200" y1="660" x2="480" y2="660" class="arr"/>
<line x1="200" y1="660" x2="200" y2="680" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="660" x2="480" y2="680" class="arr" marker-end="url(#arrow)"/>

<!-- Section 6: Evaluation -->
<text class="th" x="340" y="695" text-anchor="middle" dominant-baseline="central">Evaluation</text>

<rect x="80" y="710" width="240" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="200" y="732" text-anchor="middle" dominant-baseline="central" fill="#085041">Internal validation</text>
<text class="ts" x="200" y="752" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">5-fold CV (n = 125)</text>
<text class="ts" x="200" y="768" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Bootstrap CI (n = 2000)</text>

<rect x="360" y="710" width="240" height="80" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="480" y="732" text-anchor="middle" dominant-baseline="central" fill="#712B13">External validation</text>
<text class="ts" x="480" y="752" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Independent set (n = 58)</text>
<text class="ts" x="480" y="768" text-anchor="middle" dominant-baseline="central" fill="#993C1D">DeLong test</text>

<line x1="200" y1="790" x2="200" y2="820" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="790" x2="480" y2="820" class="arr" marker-end="url(#arrow)"/>

<rect x="80" y="820" width="240" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="200" y="842" text-anchor="middle" dominant-baseline="central">AUC, sensitivity, specificity</text>

<rect x="360" y="820" width="240" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="480" y="842" text-anchor="middle" dominant-baseline="central">AUC, sensitivity, specificity</text>

<text class="ts" x="480" y="886" text-anchor="middle" dominant-baseline="central">+ Reader 1 &amp; Reader 2 comparison</text>

</svg>